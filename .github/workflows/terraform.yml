name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Serialize runs so two applies can't race (R2 has no state lock).
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.R2_BUCKET }}" \
            -backend-config="key=tendai-dev/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="force_path_style=true"

      - name: Terraform Validate
        run: terraform validate

      # The Pages project and DNS records were originally created before the
      # R2 backend existed. Adopt them into the remote state on pushes. The
      # state-show checks make this step safe on every subsequent push.
      - name: Adopt existing Cloudflare resources into R2 state
        if: github.event_name == 'push'
        shell: bash
        run: |
          import_if_unmanaged() {
            local address="$1"
            local id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "$address is already in state"
            else
              terraform import -input=false "$address" "$id"
            fi
          }

          import_if_unmanaged cloudflare_pages_project.site \
            "${TF_VAR_cloudflare_account_id}/tendai-dev"
          import_if_unmanaged cloudflare_pages_domain.apex \
            "${TF_VAR_cloudflare_account_id}/tendai-dev/tendai.dev"
          import_if_unmanaged cloudflare_pages_domain.www \
            "${TF_VAR_cloudflare_account_id}/tendai-dev/www.tendai.dev"
          import_if_unmanaged cloudflare_dns_record.apex \
            "${TF_VAR_zone_id}/59b64d156dcf28dd404b6fa37724f703"
          import_if_unmanaged cloudflare_dns_record.www \
            "${TF_VAR_zone_id}/b528eba2f9ca8da443656e83c3e1a1af"

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
